[package]
name = "rustario64-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
description = "Optional wgpu presentation and viewer for Rustario64; never feeds gameplay state"

[[bin]]
name = "rustario64-viewer"
path = "src/main.rs"

[[bin]]
name = "rustario64-desktop"
path = "src/launcher.rs"

[dependencies]
rustario64 = { path = ".." }
wgpu = "30.0.1"
winit = "0.30.13"
pollster = "1.0.1"
png = "0.18.1"
egui = "0.36.2"
egui-winit = { version = "0.36.2", default-features = false, features = ["x11", "wayland"] }
egui-wgpu = { version = "0.36.2", default-features = false }
rfd = "0.17.2"
gilrs = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
