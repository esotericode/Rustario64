[workspace]
members = [".", "render", "oracle"]
resolver = "3"

[package]
name = "rustario64"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
description = "Rust ROM import and deterministic runtime foundation for Super Mario 64"

[dependencies]
sha1 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
