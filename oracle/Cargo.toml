[package]
name = "rustario64-oracle"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
description = "Development-only differential oracle: pinned CC0 decomp C compiled natively. Never linked into the game runtime."
build = "build.rs"

[dependencies]
rustario64 = { path = ".." }

[dev-dependencies]
serde_json = "1.0.151"

[build-dependencies]
cc = "1.6.0"

[lints.clippy]
all = "warn"
